apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-ng
  labels:
    app: stress-ng
    test-workload: cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress-ng
  template:
    metadata:
      labels:
        app: stress-ng
        test-workload: cpu
    spec:
      containers:
        - name: stress-ng
          image: quay.io/srcc/stress-ng:latest
          args:
            - --cpu
            - "1"
            - --cpu-method
            - matrixprod
            - --metrics-brief
            - --verify
            - --timeout
            - "0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: stress-ng
