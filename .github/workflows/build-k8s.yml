name: Build & publish — hummingbird-k8s

on:
  push:
    tags: ['k8s/v*']
    branches: ["ci/forgejo-harden-push"]  # temp: strip post-merge
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver tag (vX.Y.Z); ignored on real tag push'
        required: false
        default: 'v0.0.0-dryrun'
        type: string
      dry_run:
        description: 'Skip registry push + sign + scan. Build + login still validated.'
        required: false
        default: true
        type: boolean

# Serialize tag-driven publishes on the same ref. cancel-in-progress is
# deliberately false: a real tag push that is mid-flight must finish —
# a second invocation should queue, not pre-empt.
concurrency:
  group: build-k8s-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: forgejo.atchison.io/aatchison/hummingbird-k8s

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          fetch-depth: 0

      - name: Refuse to publish if the tagged commit isn't on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=1 forgejo main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" forgejo/main; then
            echo "Tag $GITHUB_REF points to $GITHUB_SHA, not reachable from forgejo/main." >&2
            exit 1
          fi

      - name: Resolve version + mode
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            dry_run="$INPUT_DRY_RUN"
          elif [[ "$REF" == refs/tags/k8s/* ]]; then
            version="${REF#refs/tags/k8s/}"
            dry_run="false"
          else
            # Branch push: build + login validation only, no push
            version="v0.0.0-dryrun"
            dry_run="true"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version $version is not vX.Y.Z[-pre]" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$version dry_run=$dry_run" >&2

      - name: Log in to Forgejo container registry
        if: steps.v.outputs.dry_run == 'false'
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login forgejo.atchison.io -u aatchison --password-stdin

      - name: Build OCI image
        env:
          DOCKER_BUILDKIT: "1"
          VERSION: ${{ steps.v.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg "REVISION=${REVISION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --file containers/k8s/Containerfile \
            .

      - name: Push to Forgejo container registry
        if: steps.v.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"

      - name: Push :latest tag (tag-triggered publishes only)
        if: steps.v.outputs.dry_run == 'false' && startsWith(github.ref, 'refs/tags/')
        run: docker push "${IMAGE}:latest"

      - name: Resolve pushed image digest
        id: digest
        if: steps.v.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" \
            | cut -d@ -f2)
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "could not determine image digest" >&2; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        if: steps.v.outputs.dry_run == 'false'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      # github/codeql-action/upload-sarif is a sub-path action not mirrored
      # on Forgejo; it causes parse-time rejection even behind an if-guard.
      # Omitted here. Re-add if deploying on GitHub Actions.

      - name: Generate SBOM with syft
        if: steps.v.outputs.dry_run == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          output-file: sbom-${{ steps.v.outputs.version }}.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        if: steps.v.outputs.dry_run == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-k8s-${{ steps.v.outputs.version }}
          path: sbom-${{ steps.v.outputs.version }}.spdx.json

      - name: Install cosign
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless, OIDC)
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: cosign attest SBOM
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "sbom-${VERSION}.spdx.json" \
            "${IMAGE}@${DIGEST}"

      - name: docker logout
        if: always()
        run: docker logout forgejo.atchison.io
