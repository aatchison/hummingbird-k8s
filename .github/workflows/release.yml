# Release pipeline for the `hbird` Rust CLI (issue #290, epic #279, Wave C).
#
# Triggers:
# - push to `v*` tag (the canonical release path) — full publish.
# - workflow_dispatch with `dry_run=true` (the smoke-test path) — runs
#   every step EXCEPT the final publish (release upload, registry push,
#   sign). This lets operators rehearse the workflow without minting a
#   real release; CI gates the workflow even when no tag is ever pushed.
#
# Security: ONLY repo-controlled context values flow into `run:` scripts;
# no untrusted PR-body / commit-message / issue-title interpolation.
# All input values pass through `env:` blocks (never direct `${{ }}`
# interpolation into shell script bodies) and are validated against the
# vX.Y.Z[-pre] regex before use.

name: Release hbird CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver tag for dry-run (vX.Y.Z[-pre]); ignored on real tag push'
        required: false
        default: 'v0.0.0-dryrun'
        type: string
      dry_run:
        description: 'Skip publish (release upload + registry push + sign). Build + image-build still validated.'
        required: false
        default: true
        type: boolean

# Serialize tag-driven publishes on the same ref. cancel-in-progress is
# deliberately false: a real publish that is mid-flight (sign, push, etc.)
# must finish — a second invocation should queue, not pre-empt.
concurrency:
  group: release-hbird-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; the release job below opts into the write scopes it
# actually needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
  IMAGE: forgejo.atchison.io/aatchison/hbird

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # release create + asset upload
      packages: write       # registry push
      id-token: write       # cosign keyless OIDC (GitHub only)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          fetch-depth: 0

      # Refuse to publish a tag that doesn't sit on main. Skipped on
      # workflow_dispatch and branch pushes.
      - name: Refuse to publish if the tagged commit isn't on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=1 forgejo main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" forgejo/main; then
            echo "Tag $GITHUB_REF points to $GITHUB_SHA, not reachable from forgejo/main." >&2
            exit 1
          fi

      - name: Resolve version + mode
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            dry_run="$INPUT_DRY_RUN"
          elif [[ "$REF" == refs/tags/* ]]; then
            version="${REF#refs/tags/}"
            dry_run="false"
          else
            # Branch push: build + image-build validation only, no publish
            version="v0.0.0-dryrun"
            dry_run="true"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version '$version' is not vX.Y.Z[-pre]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$version dry_run=$dry_run" >&2

      - name: Install Rust toolchain (stable + musl target)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- --default-toolchain stable \
              --target x86_64-unknown-linux-musl \
              -y --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: release-musl-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            release-musl-

      - name: Install musl-tools (linker + headers for musl target)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static x86_64-musl binary
        working-directory: rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            --package hbird-cli \
            --bin hbird

      - name: Verify binary is fully static
        working-directory: rust
        run: |
          set -euo pipefail
          bin="target/x86_64-unknown-linux-musl/release/hbird"
          file "$bin"
          ldd_out=$(ldd "$bin" 2>&1 || true)
          echo "$ldd_out"
          if [[ "$ldd_out" != *"statically linked"* ]] \
             && [[ "$ldd_out" != *"not a dynamic executable"* ]]; then
            echo "::error::hbird is dynamically linked — musl static build failed"
            exit 1
          fi
          ./"$bin" --version

      - name: Stage release artifacts
        id: stage
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp rust/target/x86_64-unknown-linux-musl/release/hbird \
             "dist/hbird-${VERSION}-x86_64-unknown-linux-musl"
          chmod +x "dist/hbird-${VERSION}-x86_64-unknown-linux-musl"
          ( cd dist && sha256sum "hbird-${VERSION}-x86_64-unknown-linux-musl" \
              > "hbird-${VERSION}-SHA256SUMS" )
          ls -la dist/
          echo "binary=dist/hbird-${VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_OUTPUT"
          echo "checksums=dist/hbird-${VERSION}-SHA256SUMS" >> "$GITHUB_OUTPUT"

      # Cosign keyless signing requires GitHub's OIDC provider; skip on Forgejo.
      - name: Install cosign
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign binary (keyless OIDC)
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BINARY: ${{ steps.stage.outputs.binary }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "dist/hbird-${VERSION}-x86_64-unknown-linux-musl.cosign.bundle" \
            "$BINARY"
          ls -la dist/

      - name: Verify cosign signature locally before publish
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BINARY: ${{ steps.stage.outputs.binary }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "dist/hbird-${VERSION}-x86_64-unknown-linux-musl.cosign.bundle" \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$BINARY"

      # ---- OCI image build + push ----------------------------------------

      - name: Log in to Forgejo container registry
        if: steps.v.outputs.dry_run == 'false'
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login forgejo.atchison.io -u aatchison --password-stdin

      # Stage the OCI build context as a tiny directory containing just
      # the binary + Containerfile. Keeps the build context small (~5MB)
      # and reproducible.
      - name: Stage OCI build context
        id: octx
        env:
          BINARY: ${{ steps.stage.outputs.binary }}
        run: |
          set -euo pipefail
          mkdir -p octx
          cp "$BINARY" octx/hbird
          cp Containerfile.hbird octx/Containerfile
          chmod +x octx/hbird
          echo "context=octx" >> "$GITHUB_OUTPUT"

      - name: Build OCI image
        env:
          DOCKER_BUILDKIT: "1"
          VERSION: ${{ steps.v.outputs.version }}
          REVISION: ${{ github.sha }}
          CTX: ${{ steps.octx.outputs.context }}
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${REVISION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --file "${CTX}/Containerfile" \
            "${CTX}"

      - name: Push to Forgejo container registry
        id: push
        if: steps.v.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"

      - name: Push :latest tag (tag-triggered publishes only)
        if: steps.v.outputs.dry_run == 'false' && startsWith(github.ref, 'refs/tags/')
        run: docker push "${IMAGE}:latest"

      - name: Resolve pushed image digest
        id: digest
        if: steps.v.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" \
            | cut -d@ -f2)
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "could not determine image digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cosign sign image (keyless OIDC)
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # ---- Release upload ------------------------------------------------

      # Upload binary + checksums + signature to GitHub Release (GitHub only).
      - name: Upload binary + checksums + signature to GitHub Release
        if: steps.v.outputs.dry_run == 'false' && github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "\`hbird\` ${VERSION} — hummingbird-k8s operator CLI."
            echo
            echo "## Install (binary)"
            echo
            echo '```sh'
            echo "curl -sSL -o hbird https://github.com/${REPO}/releases/download/${VERSION}/hbird-${VERSION}-x86_64-unknown-linux-musl"
            echo "curl -sSL -o hbird.cosign.bundle https://github.com/${REPO}/releases/download/${VERSION}/hbird-${VERSION}-x86_64-unknown-linux-musl.cosign.bundle"
            echo "cosign verify-blob \\"
            echo "  --bundle hbird.cosign.bundle \\"
            echo "  --certificate-identity-regexp \"^https://github.com/${REPO}/.github/workflows/release.yml@\" \\"
            echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\"
            echo "  hbird"
            echo "chmod +x hbird && ./hbird --version"
            echo '```'
            echo
            echo "## Install (OCI image)"
            echo
            echo '```sh'
            echo "podman pull forgejo.atchison.io/${OWNER}/hbird:${VERSION}"
            echo '```'
          } > "$notes_file"
          gh release create "$VERSION" \
            --title "hbird $VERSION" \
            --notes-file "$notes_file" \
            "dist/hbird-${VERSION}-x86_64-unknown-linux-musl" \
            "dist/hbird-${VERSION}-x86_64-unknown-linux-musl.cosign.bundle" \
            "dist/hbird-${VERSION}-SHA256SUMS"

      # Create Forgejo release via API (Forgejo only).
      - name: Create Forgejo release
        if: steps.v.outputs.dry_run == 'false' && github.server_url != 'https://github.com'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          body="\`hbird\` ${VERSION} — hummingbird-k8s operator CLI.\n\n## Install (OCI image)\n\`\`\`sh\npodman pull forgejo.atchison.io/${OWNER}/hbird:${VERSION}\n\`\`\`"
          release_id=$(curl -sSf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${SERVER}/api/v1/repos/${REPO}/releases" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"hbird ${VERSION}\",\"body\":\"${body}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          for f in "dist/hbird-${VERSION}-x86_64-unknown-linux-musl" \
                   "dist/hbird-${VERSION}-SHA256SUMS"; do
            curl -sSf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${SERVER}/api/v1/repos/${REPO}/releases/${release_id}/assets?name=$(basename "$f")" \
              --data-binary "@$f"
          done

      # Publish to the Forgejo GENERIC PACKAGE registry (Forgejo only).
      # Distinct from the release above: generic packages have STABLE,
      # predictable URLs —
      #   {SERVER}/api/packages/{OWNER}/generic/hbird/{VERSION}/{FILE}
      # — which is what lets a CI runner or operator host download-and-call
      # the exact tested binary with a bare curl, no auth, no install:
      #   curl -sSO .../generic/hbird/$V/hbird-$V-x86_64-unknown-linux-musl
      #   make deploy-cluster CONFIG=... HBIRD=$PWD/hbird-$V-...
      # (Release assets get UUID attachment URLs; they cannot be fetched by
      # a version-derived path, so they don't serve the bootstrap use-case.)
      - name: Publish binary to Forgejo generic package registry
        if: steps.v.outputs.dry_run == 'false' && github.server_url != 'https://github.com'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          base="${SERVER}/api/packages/${OWNER}/generic/hbird/${VERSION}"
          for f in "dist/hbird-${VERSION}-x86_64-unknown-linux-musl" \
                   "dist/hbird-${VERSION}-SHA256SUMS"; do
            # PUT is idempotent-hostile in the generic registry (409 on
            # re-upload of the same version+file); delete-then-put keeps a
            # re-run of a failed publish from wedging on its own partial
            # success, while a genuinely different re-publish of the same
            # VERSION still fails loudly at the release step above.
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${base}/$(basename "$f")" || true
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              --upload-file "$f" "${base}/$(basename "$f")")
            [ "$code" = "201" ] || { echo "generic publish of $(basename "$f") got HTTP $code" >&2; exit 1; }
            echo "published ${base}/$(basename "$f")"
          done

      - name: Dry-run summary
        if: steps.v.outputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "## Dry-run summary"
            echo ""
            echo "Version: \`${VERSION}\`"
            echo ""
            echo "Steps exercised:"
            echo "- static musl binary build + ldd-static verification"
            echo "- OCI image build (docker build, no push)"
            echo ""
            echo "Steps SKIPPED (dry-run):"
            echo "- cosign sign-blob (GitHub only — requires GitHub OIDC)"
            echo "- Forgejo/GitHub registry push"
            echo "- cosign sign image (GitHub only)"
            echo "- release create"
            echo ""
            echo "Artifacts staged in \`dist/\`:"
            ls -la dist/
          } >> "$GITHUB_STEP_SUMMARY"

      - name: docker logout
        if: always()
        run: docker logout forgejo.atchison.io
