# Persistent hummingbird cluster on the `geary` physical KVM host (#15).
#
# A portable, committed example of the geary site config (real non-secret params:
# VM names, POOL_DIR, sizing) that a new operator copies to `cluster.local.conf`
# and sets their own SSH key path. Distinct from the generic `cluster.example.conf`
# (which has no host specifics) and from the real `cluster.geary.conf`.
#
# Sourced by scripts/deploy-cluster.sh (and `hbird update-cluster`). Copy/adapt
# for other hosts by changing POOL_DIR + sizing — the schema is host-agnostic
# (node placement, pool, and sizing are CONFIG knobs, not code), so relocating
# this cluster onto future hardware is a config edit + redeploy, not a rewrite.
#
# Sizing rationale: CPU-only, drawn from geary's SPARE capacity. geary is
# 64 cores / 377 GiB; existing guests (thegearyk8s 32 vCPU/128 GiB, plus
# claudia2 / work-dev / dev VMs / the bluefin sandbox) allocate ~244 GiB,
# leaving ~133 GiB unallocated. This cluster takes 12 vCPU / 24 GiB, leaving
# ample headroom — it does NOT starve thegearyk8s or the GPU/Gemma/forge
# workloads. Scale workers later if spare capacity allows.

# Deploy runs ON geary directly (local libvirt), so KVM_HOST is left unset.
# Remote kubectl clients can set KVM_HOST=geary to rewrite the apiserver URL.

# Libvirt domain names (also the cloud-init hostnames).
CP_NAME=hbird-geary-cp
WORKER_NAMES=(hbird-geary-w1 hbird-geary-w2)

# Operator keypair baked into the guests for root SSH.
# SSH_PUBKEY_FILE=$HOME/.ssh/id_ed25519.pub   # REQUIRED — set per operator (matches cluster.example.conf)

# Build the bootc images locally on geary (proven by the bluefin cycle-4 AC).
# Switch to a registry source once the Forgejo registry is populated (#13/#14).
IMAGE_SOURCE=local
ENABLE_CLOUD_INIT=1

# qcow2 templates + per-VM clones live on the mass2 pool (3+ TB free).
POOL_DIR=/mnt/mass2/vms

# Per-node sizing (CPU-only).
CP_MEMORY=8192
CP_VCPUS=4
WORKER_MEMORY=8192
WORKER_VCPUS=4
